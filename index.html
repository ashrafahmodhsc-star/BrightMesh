<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrightMesh Study Tools</title>
<style>
  :root{
    --bg:#0b0b10;
    --card:#17151f;
    --card2:#1e1b28;
    --purple:#7F77DD;
    --purple-dim:#5b54a8;
    --teal:#4fd8b8;
    --gold:#f0b84f;
    --blue:#5fa8f2;
    --pink:#f2789f;
    --text:#f1eef7;
    --sub:#9791ab;
    --danger:#ef5d78;
    --green:#5fd99a;
    --border:#2b2836;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(127,119,221,0.20), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(79,216,184,0.10), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', 'Noto Sans Bengali', sans-serif;
    min-height:100vh;
    padding:16px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  h1{
    font-size:22px;
    font-weight:800;
    margin-bottom:18px;
    letter-spacing:0.5px;
    background:linear-gradient(90deg, var(--purple), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    display:inline-block;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    font-size:13px;
    color:var(--sub);
    cursor:pointer;
    white-space:nowrap;
    transition:0.18s;
  }
  .tab.active{
    color:#0b0b10;
    font-weight:700;
    border-color:transparent;
  }
  .tab[data-tab="timer"].active{background:var(--purple);}
  .tab[data-tab="todo1"].active{background:var(--teal);}
  .tab[data-tab="todo2"].active{background:var(--gold);}
  .tab[data-tab="history"].active{background:var(--blue);}
  .tab[data-tab="countdown"].active{background:var(--pink);}

  .panel{display:none;}
  .panel.active{display:block;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-top:3px solid var(--accent, var(--purple));
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,0.5);
  }
  #timer .card{--accent:var(--purple);}
  #todo1 .card{--accent:var(--teal);}
  #todo2 .card{--accent:var(--gold);}
  #history .card{--accent:var(--blue);}
  #countdown .card{--accent:var(--pink);}

  /* Timer */
  .timer-display{
    font-size:54px;
    font-weight:800;
    text-align:center;
    letter-spacing:2px;
    margin:14px 0;
    font-variant-numeric:tabular-nums;
    color:var(--purple);
    text-shadow:0 0 24px rgba(127,119,221,0.35);
  }
  .timer-display.running{
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{text-shadow:0 0 24px rgba(127,119,221,0.35);}
    50%{text-shadow:0 0 36px rgba(127,119,221,0.6);}
  }
  .timer-btns{display:flex;gap:8px;justify-content:center;margin-top:10px;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    font-size:14px;
    font-weight:700;
    transition:0.15s;
  }
  button:disabled{opacity:0.4;cursor:default;}
  .btn-primary{background:var(--purple);color:#fff;box-shadow:0 4px 14px -4px rgba(127,119,221,0.6);}
  .btn-primary:hover:not(:disabled){background:var(--purple-dim);transform:translateY(-1px);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--purple);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-danger:hover{background:rgba(239,93,120,0.1);}
  .subject-row{display:flex;gap:8px;margin-bottom:10px;}
  input[type="text"], input[type="date"], input[type="time"]{
    flex:1;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--purple);}
  input::placeholder{color:var(--sub);}

  /* todo1 accent button */
  #todo1 .btn-primary{background:var(--teal);color:#0b0b10;box-shadow:0 4px 14px -4px rgba(79,216,184,0.6);}
  #todo1 .btn-primary:hover:not(:disabled){background:#3fc0a2;}
  #todo1 input[type="checkbox"]{accent-color:var(--teal);}

  /* todo2 accent button */
  #todo2 .btn-primary{background:var(--gold);color:#0b0b10;box-shadow:0 4px 14px -4px rgba(240,184,79,0.6);}
  #todo2 .btn-primary:hover:not(:disabled){background:#d9a23e;}
  #todo2 input[type="checkbox"]{accent-color:var(--gold);}

  /* Todo */
  .todo-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--border);
  }
  .todo-item:last-child{border-bottom:none;}
  .todo-item input[type="checkbox"]{
    width:18px;height:18px;flex:0 0 auto;
  }
  .todo-text{flex:1;font-size:14px;}
  .todo-text.done{color:var(--sub);text-decoration:line-through;}
  .del-btn{
    background:none;border:none;color:var(--sub);font-size:16px;padding:2px 6px;
  }
  .del-btn:hover{color:var(--danger);}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:16px 0;}

  /* History */
  .history-item{
    padding:10px 4px;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .history-item:last-child{border-bottom:none;}
  .h-top{display:flex;justify-content:space-between;color:var(--text);font-weight:700;}
  .h-top span:last-child{color:var(--blue);}
  .h-sub{color:var(--sub);margin-top:2px;}

  /* Countdown */
  .countdown-num{
    font-size:48px;
    font-weight:800;
    text-align:center;
    margin:10px 0 2px;
    transition:color 0.3s;
  }
  .countdown-label{text-align:center;color:var(--sub);font-size:13px;margin-bottom:10px;}
  .exam-name{
    text-align:center;
    font-size:15px;
    color:var(--text);
    margin-bottom:4px;
    font-weight:700;
  }
  .progress-track{
    height:8px;
    background:var(--card2);
    border-radius:6px;
    overflow:hidden;
    margin:14px 0 18px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--pink), var(--purple));
    border-radius:6px;
    transition:width 0.4s;
  }
  #countdown .btn-primary{background:var(--pink);color:#fff;box-shadow:0 4px 14px -4px rgba(242,120,159,0.6);}
  #countdown .btn-primary:hover:not(:disabled){background:#d8618a;}

  label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 BrightMesh Study Tools</h1>

  <div class="tabs">
    <div class="tab active" data-tab="timer">⏱ টাইমার</div>
    <div class="tab" data-tab="todo1">✅ ডেইলি টাস্ক</div>
    <div class="tab" data-tab="todo2">🎯 এক্সাম চেকলিস্ট</div>
    <div class="tab" data-tab="history">📜 হিস্টোরি</div>
    <div class="tab" data-tab="countdown">📅 কাউন্টডাউন</div>
  </div>

  <!-- TIMER -->
  <div class="panel active" id="timer">
    <div class="card">
      <div class="subject-row">
        <input type="text" id="timerSubject" placeholder="কী পড়ছো? (যেমন: জৈব রসায়ন)">
      </div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-btns">
        <button class="btn-primary" id="startBtn">শুরু</button>
        <button class="btn-outline" id="pauseBtn" disabled>থামাও</button>
        <button class="btn-danger" id="resetBtn">রিসেট</button>
      </div>
    </div>
  </div>

  <!-- TODO 1: Daily -->
  <div class="panel" id="todo1">
    <div class="card">
      <div class="subject-row">
        <input type="text" id="todo1Input" placeholder="নতুন ডেইলি টাস্ক লিখো...">
        <button class="btn-primary" id="todo1Add">যোগ</button>
      </div>
      <div id="todo1List"></div>
    </div>
  </div>

  <!-- TODO 2: Exam checklist -->
  <div class="panel" id="todo2">
    <div class="card">
      <div class="subject-row">
        <input type="text" id="todo2Input" placeholder="এক্সাম প্রিপ গোল লিখো...">
        <button class="btn-primary" id="todo2Add">যোগ</button>
      </div>
      <div id="todo2List"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="panel" id="history">
    <div class="card">
      <div id="historyList"></div>
    </div>
  </div>

  <!-- COUNTDOWN -->
  <div class="panel" id="countdown">
    <div class="card">
      <div class="field">
        <label>পরীক্ষার নাম</label>
        <input type="text" id="examName" placeholder="যেমন: HSC কেমিস্ট্রি ২য় পত্র">
      </div>
      <div class="field">
        <label>পরীক্ষার তারিখ</label>
        <input type="date" id="examDate">
      </div>
      <button class="btn-primary" id="examSave" style="width:100%;margin-top:4px;">সেভ করো</button>
    </div>
    <div class="card" id="countdownResult" style="display:none;">
      <div class="exam-name" id="cdName"></div>
      <div class="countdown-num" id="cdDays">-</div>
      <div class="countdown-label" id="cdLabel">দিন বাকি</div>
      <div class="progress-track"><div class="progress-fill" id="cdProgress" style="width:0%;"></div></div>
      <button class="btn-outline" id="examClear" style="width:100%;">মুছে ফেলো</button>
    </div>
  </div>

</div>

<script>
// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab==='countdown') renderCountdown();
    if(tab.dataset.tab==='history') renderHistory();
  });
});

// ---------- Storage helpers ----------
function load(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function save(key, val){
  localStorage.setItem(key, JSON.stringify(val));
}

// ---------- Timer ----------
let timerInterval = null;
let elapsedMs = load('bm_timer_elapsed', 0);
let running = false;

const timerDisplay = document.getElementById('timerDisplay');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const timerSubject = document.getElementById('timerSubject');
timerSubject.value = load('bm_timer_subject', '');

function formatTime(ms){
  const totalSec = Math.floor(ms/1000);
  const h = String(Math.floor(totalSec/3600)).padStart(2,'0');
  const m = String(Math.floor((totalSec%3600)/60)).padStart(2,'0');
  const s = String(totalSec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function updateDisplay(){
  timerDisplay.textContent = formatTime(elapsedMs);
}
updateDisplay();

let lastTick = null;
function tick(){
  const now = Date.now();
  elapsedMs += now - lastTick;
  lastTick = now;
  updateDisplay();
}

startBtn.addEventListener('click', ()=>{
  if(running) return;
  running = true;
  lastTick = Date.now();
  timerInterval = setInterval(tick, 1000);
  startBtn.disabled = true;
  pauseBtn.disabled = false;
  timerDisplay.classList.add('running');
});

pauseBtn.addEventListener('click', ()=>{
  if(!running) return;
  running = false;
  clearInterval(timerInterval);
  save('bm_timer_elapsed', elapsedMs);
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  timerDisplay.classList.remove('running');
});

resetBtn.addEventListener('click', ()=>{
  const subject = timerSubject.value.trim() || 'নাম দেওয়া হয়নি';
  if(elapsedMs > 0){
    const history = load('bm_history', []);
    history.unshift({
      subject: subject,
      duration: formatTime(elapsedMs),
      date: new Date().toLocaleString('bn-BD', {dateStyle:'medium', timeStyle:'short'})
    });
    save('bm_history', history);
  }
  running = false;
  clearInterval(timerInterval);
  elapsedMs = 0;
  save('bm_timer_elapsed', 0);
  updateDisplay();
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  timerDisplay.classList.remove('running');
});

timerSubject.addEventListener('input', ()=>{
  save('bm_timer_subject', timerSubject.value);
});

// ---------- Todo lists (generic) ----------
function setupTodo(key, inputId, addId, listId){
  const input = document.getElementById(inputId);
  const addBtn = document.getElementById(addId);
  const listEl = document.getElementById(listId);

  function render(){
    const items = load(key, []);
    listEl.innerHTML = '';
    if(items.length === 0){
      listEl.innerHTML = '<div class="empty">এখনো কিছু যোগ করা হয়নি</div>';
      return;
    }
    items.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className = 'todo-item';
      row.innerHTML = `
        <input type="checkbox" ${item.done ? 'checked' : ''} data-idx="${idx}">
        <span class="todo-text ${item.done ? 'done' : ''}">${escapeHtml(item.text)}</span>
        <button class="del-btn" data-idx="${idx}">✕</button>
      `;
      listEl.appendChild(row);
    });

    listEl.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const items = load(key, []);
        items[cb.dataset.idx].done = cb.checked;
        save(key, items);
        render();
      });
    });
    listEl.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const items = load(key, []);
        items.splice(btn.dataset.idx, 1);
        save(key, items);
        render();
      });
    });
  }

  function addItem(){
    const text = input.value.trim();
    if(!text) return;
    const items = load(key, []);
    items.push({text, done:false});
    save(key, items);
    input.value = '';
    render();
  }

  addBtn.addEventListener('click', addItem);
  input.addEventListener('keypress', (e)=>{
    if(e.key === 'Enter') addItem();
  });

  render();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

setupTodo('bm_todo_daily', 'todo1Input', 'todo1Add', 'todo1List');
setupTodo('bm_todo_exam', 'todo2Input', 'todo2Add', 'todo2List');

// ---------- History ----------
function renderHistory(){
  const listEl = document.getElementById('historyList');
  const history = load('bm_history', []);
  if(history.length === 0){
    listEl.innerHTML = '<div class="empty">এখনো কোনো স্টাডি সেশন সেভ হয়নি। টাইমার রিসেট করলে এখানে যোগ হবে।</div>';
    return;
  }
  listEl.innerHTML = history.map(h=>`
    <div class="history-item">
      <div class="h-top"><span>${escapeHtml(h.subject)}</span><span>${h.duration}</span></div>
      <div class="h-sub">${h.date}</div>
    </div>
  `).join('');
}
renderHistory();

// ---------- Countdown ----------
const examNameInput = document.getElementById('examName');
const examDateInput = document.getElementById('examDate');
const examSaveBtn = document.getElementById('examSave');
const examClearBtn = document.getElementById('examClear');
const countdownResult = document.getElementById('countdownResult');
const cdProgress = document.getElementById('cdProgress');

function renderCountdown(){
  const exam = load('bm_exam', null);
  if(!exam){
    countdownResult.style.display = 'none';
    return;
  }
  const now = new Date();
  const target = new Date(exam.date + 'T00:00:00');
  const diffMs = target - now;
  const diffDays = Math.ceil(diffMs / (1000*60*60*24));

  document.getElementById('cdName').textContent = exam.name;
  const cdDays = document.getElementById('cdDays');
  const cdLabel = document.getElementById('cdLabel');

  if(diffDays > 0){
    cdDays.textContent = diffDays;
    cdLabel.textContent = 'দিন বাকি';
    // color urgency: red <7, gold <30, teal beyond
    let color = 'var(--teal)';
    let pct = 100;
    if(diffDays <= 7){ color = 'var(--danger)'; pct = (diffDays/7)*20; }
    else if(diffDays <= 30){ color = 'var(--gold)'; pct = 20 + ((30-diffDays)/23)*40; }
    else { color = 'var(--teal)'; pct = Math.max(60, 100 - diffDays/3); }
    cdDays.style.color = color;
    cdProgress.style.width = Math.min(100, pct) + '%';
  } else if(diffDays === 0){
    cdDays.textContent = '🔥';
    cdDays.style.color = 'var(--danger)';
    cdLabel.textContent = 'আজই পরীক্ষা!';
    cdProgress.style.width = '100%';
  } else {
    cdDays.textContent = '✓';
    cdDays.style.color = 'var(--green)';
    cdLabel.textContent = 'পরীক্ষা শেষ হয়ে গেছে';
    cdProgress.style.width = '100%';
  }
  countdownResult.style.display = 'block';
}

examSaveBtn.addEventListener('click', ()=>{
  const name = examNameInput.value.trim();
  const date = examDateInput.value;
  if(!name || !date){
    alert('পরীক্ষার নাম এবং তারিখ দুটোই দাও');
    return;
  }
  save('bm_exam', {name, date});
  renderCountdown();
});

examClearBtn.addEventListener('click', ()=>{
  localStorage.removeItem('bm_exam');
  examNameInput.value = '';
  examDateInput.value = '';
  renderCountdown();
});

(function(){
  const exam = load('bm_exam', null);
  if(exam){
    examNameInput.value = exam.name;
    examDateInput.value = exam.date;
  }
  renderCountdown();
})();
</script>
</body>
</html>
