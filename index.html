cat > /tmp/bm_part1.html << 'EOF'
<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0066ff">
<meta name="description" content="BrightMesh — Learn Together | Bangladesh HSC Study App">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BrightMesh">
<title>BrightMesh — Learn Together 📚</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%230066ff'/><text x='96' y='130' font-size='100' text-anchor='middle' fill='white'>B</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;--bg4:#e9ecef;
  --text:#0a0a0a;--text2:#343a40;--text3:#6c757d;--text4:#adb5bd;
  --a:#0066ff;--a2:#3385ff;--al:#e8f0ff;
  --gr:#00a651;--rd:#dc3545;--gd:#f5a623;--pu:#7c3aed;--cy:#00bcd4;
  --bd:#dee2e6;--bd2:#ced4da;
  --sh:0 2px 12px rgba(0,0,0,.08);--shl:0 8px 32px rgba(0,0,0,.12);
  --r:12px;--r2:8px;
}
[data-theme="dark"]{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#22222f;
  --text:#f0f0f5;--text2:#c8c8d8;--text3:#8888a8;--text4:#555570;
  --a:#4d9fff;--a2:#77b8ff;--al:#0f1f3f;
  --bd:#2a2a3a;--bd2:#333348;
  --sh:0 2px 12px rgba(0,0,0,.4);--shl:0 8px 32px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;height:100%;}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden;}
button{cursor:pointer;font-family:inherit;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
img{max-width:100%;display:block;}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes xpFly{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
@keyframes confetti{0%{transform:translateY(-15px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:0}}
@keyframes notifIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin360{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fire{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
@keyframes countDown{0%{transform:scale(1.3);color:var(--rd)}100%{transform:scale(1)}}
@keyframes timerPulse{0%,100%{box-shadow:0 0 0 rgba(0,102,255,0)}50%{box-shadow:0 0 20px rgba(0,102,255,.4)}}

/* BASE */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);transition:all .2s;}
.btn{padding:9px 18px;border-radius:var(--r2);border:none;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-p{background:var(--a);color:#fff;}
.btn-p:hover{background:var(--a2);transform:translateY(-1px);}
.btn-s{background:var(--bg3);border:1.5px solid var(--bd);color:var(--text2);}
.btn-s:hover{border-color:var(--a);color:var(--a);}
.btn-gr{background:var(--gr);color:#fff;}
.btn-sm{padding:6px 14px;font-size:.78rem;}
.btn-rd{background:var(--rd);color:#fff;}
.inp{width:100%;background:var(--bg3);border:1.5px solid var(--bd);border-radius:var(--r2);padding:11px 14px;font-size:.9rem;color:var(--text);outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(0,102,255,.1);}
.inp::placeholder{color:var(--text4);}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.66rem;background:var(--al);color:var(--a);}
.wrap{max-width:680px;margin:0 auto;padding:10px 12px;}
.sec-title{font-size:.7rem;font-weight:600;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:9px;}
.empty{text-align:center;padding:32px 18px;color:var(--text3);}
.empty .ei{font-size:2.8rem;margin-bottom:10px;}
.empty .et{font-size:.94rem;font-weight:600;color:var(--text2);margin-bottom:5px;}
.empty .ed{font-size:.8rem;line-height:1.6;}
.divider{height:1px;background:var(--bd);margin:8px 0;}

/* LOADER */
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.ld-logo{font-size:3rem;animation:float 2s ease-in-out infinite;}
.ld-name{font-size:1.3rem;font-weight:800;color:var(--a);}
.ld-spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--a);border-radius:50%;animation:spin360 .8s linear infinite;}
.ld-sub{font-size:.76rem;color:var(--text3);}

/* AUTH */
#authWrap{position:fixed;inset:0;z-index:9000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
#authWrap.show{display:flex;}
.auth-box{background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:26px 22px;width:100%;max-width:400px;box-shadow:var(--shl);animation:pop .4s ease;}
.auth-logo-wrap{text-align:center;margin-bottom:20px;}
.auth-logo-ic{width:56px;height:56px;border-radius:15px;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;font-weight:900;margin:0 auto 8px;}
.auth-tabs{display:flex;gap:4px;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px;}
.atab{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;font-size:.84rem;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;}
.atab.on{background:var(--bg);color:var(--a);font-weight:600;box-shadow:var(--sh);}
.auth-field{margin-bottom:11px;}
.auth-field label{display:block;font-size:.79rem;font-weight:500;color:var(--text2);margin-bottom:5px;}
.auth-err{background:#fff5f5;border:1px solid #ffd0d0;border-radius:var(--r2);padding:9px 12px;font-size:.8rem;color:var(--rd);margin-bottom:11px;display:none;}
[data-theme="dark"] .auth-err{background:rgba(220,53,69,.1);border-color:rgba(220,53,69,.3);}
.or-div{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:.74rem;color:var(--text3);}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--bd);}
.g-btn{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:var(--r2);background:var(--bg3);color:var(--text2);font-size:.88rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;}
.g-btn:hover{border-color:var(--a);}

/* PWA BANNER */
#pwaBanner{position:fixed;bottom:66px;left:10px;right:10px;z-index:8000;background:var(--a);color:#fff;border-radius:var(--r);padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:var(--shl);animation:slideUp .4s ease;}
#pwaBanner.show{display:flex;}
.pb-text{flex:1;}
.pb-title{font-size:.88rem;font-weight:700;}
.pb-sub{font-size:.7rem;opacity:.85;}
.pb-install{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 14px;color:#fff;font-size:.78rem;font-weight:700;cursor:pointer;}
.pb-x{background:none;border:none;color:rgba(255,255,255,.75);font-size:1.2rem;cursor:pointer;}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:300;background:var(--bg);border-bottom:1px solid var(--bd);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:var(--sh);}
.logo{display:flex;align-items:center;gap:8px;}
.logo-ic{width:30px;height:30px;border-radius:8px;background:var(--a);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:#fff;font-weight:900;}
.logo-tx{font-size:1rem;font-weight:800;}
.logo-tx span{color:var(--a);}
.tb-r{display:flex;align-items:center;gap:5px;}
.tb-btn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;position:relative;transition:all .2s;}
.tb-btn:hover{border-color:var(--a);}
.tb-badge{position:absolute;top:0;right:0;width:14px;height:14px;background:var(--rd);border-radius:50%;font-size:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--bg);}
.tb-av{width:32px;height:32px;border-radius:50%;background:var(--a);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;color:#fff;cursor:pointer;border:2px solid var(--bd);}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:12px;}
.s-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:.9rem;}
.s-inp{padding-left:36px;padding-right:34px;}
.s-clr{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;display:none;}
.s-drop{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);margin-top:5px;overflow:hidden;display:none;box-shadow:var(--sh);max-height:300px;overflow-y:auto;}
.sd-item{padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .15s;}
.sd-item:last-child{border-bottom:none;}
.sd-item:hover{background:var(--bg3);}
.sd-title{font-size:.86rem;font-weight:500;margin-bottom:2px;}
.sd-meta{font-size:.72rem;color:var(--text3);}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:300;background:var(--bg);border-top:1px solid var(--bd);display:flex;height:58px;box-shadow:0 -2px 10px rgba(0,0,0,.06);overflow-x:auto;}
.bnav::-webkit-scrollbar{display:none;}
.bni{flex:1;min-width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.5rem;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;transition:color .2s;position:relative;}
.bni.active{color:var(--a);}
.bni .ni{font-size:1.1rem;line-height:1;}
.bni .ndot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;background:var(--rd);border-radius:50%;border:1.5px solid var(--bg);}

/* MAIN */
.main{padding:56px 0 60px;min-height:100vh;}
.panel{display:none;}
.panel.active{display:block;animation:fadeIn .3s ease;}

/* STORIES */
.stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.stories::-webkit-scrollbar{display:none;}
.st-item{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.st-ring{width:58px;height:58px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,var(--a),var(--pu));}
.st-ring.add{background:var(--bg3);border:2px dashed var(--bd2);}
.st-ring.seen{background:var(--bd2);}
.st-av{width:100%;height:100%;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;border:2.5px solid var(--bg);color:#fff;}
.st-name{font-size:.57rem;color:var(--text3);max-width:58px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* CREATE POST */
.create-post{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:12px;}
.cp-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.cp-inp{flex:1;background:var(--bg3);border:1.5px solid var(--bd);border-radius:24px;padding:9px 15px;font-size:.86rem;color:var(--text);outline:none;cursor:pointer;}
.cp-inp::placeholder{color:var(--text4);}
.cp-acts{display:flex;gap:3px;border-top:1px solid var(--bd);padding-top:9px;}
.cp-act{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;border-radius:var(--r2);font-size:.73rem;font-weight:500;border:none;background:none;color:var(--text3);cursor:pointer;transition:background .2s;}
.cp-act:hover{background:var(--bg3);}

/* POST CARD */
.pc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden;animation:fadeIn .4s ease;}
.pc-hd{display:flex;align-items:center;gap:9px;padding:11px 12px 6px;}
.pc-meta{flex:1;}
.pc-name{font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.pc-time{font-size:.67rem;color:var(--text3);margin-top:2px;}
.pc-more{width:26px;height:26px;border-radius:50%;border:none;background:none;font-size:1rem;color:var(--text3);cursor:pointer;}
.pc-txt{padding:2px 12px 9px;font-size:.88rem;line-height:1.65;}
.pc-tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 9px;}
.pc-stats{padding:6px 12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);font-size:.69rem;color:var(--text3);}
.pc-acts{display:flex;}
.pa{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;font-size:.75rem;font-weight:500;border:none;background:none;color:var(--text3);cursor:pointer;transition:background .2s;}
.pa:hover{background:var(--bg3);}
.pa.liked{color:var(--rd);}

/* POST MODAL */
#postModal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;}
#postModal.show{display:flex;}
.pm-box{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:680px;padding:16px 14px 28px;animation:slideUp .35s ease;max-height:92vh;overflow-y:auto;}
.pm-handle{width:40px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto 14px;}
.pm-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.pm-title{font-size:.95rem;font-weight:700;}
.pm-close{background:none;border:none;font-size:1.2rem;color:var(--text3);cursor:pointer;}
.pm-ta{width:100%;background:var(--bg3);border:1.5px solid var(--bd);border-radius:var(--r2);padding:11px 13px;font-size:.9rem;color:var(--text);outline:none;resize:none;min-height:100px;line-height:1.65;}
.pm-ta:focus{border-color:var(--a);}
.pm-cats{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0;}
.pcat{padding:5px 13px;border-radius:20px;border:1.5px solid var(--bd);background:var(--bg3);font-size:.75rem;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;}
.pcat.on{border-color:var(--a);color:var(--a);background:var(--al);}
.pm-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
.pm-char{font-size:.72rem;color:var(--text3);}

/* XP HERO */
.xp-hero{background:linear-gradient(135deg,var(--a),var(--pu));color:#fff;border-radius:var(--r);padding:16px;margin-bottom:11px;position:relative;overflow:hidden;}
.xp-hero::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1);}
.xp-hero::after{content:'';position:absolute;bottom:-25px;left:-10px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.07);}
.xp-row{display:flex;align-items:center;gap:11px;margin-bottom:10px;position:relative;z-index:1;}
.xp-badge{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;cursor:pointer;flex-shrink:0;}
.xp-bar-bg{height:10px;background:rgba(255,255,255,.25);border-radius:5px;overflow:hidden;position:relative;z-index:1;}
.xp-bar-fill{height:100%;background:rgba(255,255,255,.9);border-radius:5px;transition:width .8s;}
.xp-labels{display:flex;justify-content:space-between;font-size:.6rem;opacity:.8;margin-top:4px;position:relative;z-index:1;}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px;}
.stat-box{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:13px;text-align:center;}
.stat-val{font-size:1.4rem;font-weight:700;color:var(--a);display:block;font-family:'Fira Code',monospace;}
.stat-lbl{font-size:.67rem;color:var(--text3);margin-top:3px;}
.stat-chg{font-size:.6rem;color:var(--gr);margin-top:2px;}

/* STREAK */
.streak-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center;margin-bottom:11px;border-left:4px solid var(--gd);}
.s-days{display:flex;justify-content:center;gap:5px;margin:9px 0;}
.sday{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:600;color:var(--text3);}
.sday.done{background:var(--gd);border-color:var(--gd);color:#fff;}
.sday.today{border-color:var(--gd);color:var(--gd);}

/* ══ YPT-STYLE TIMER ══ */
.ypt-timer{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:11px;}
.ypt-header{background:linear-gradient(135deg,#0a0a0f,#1a1a2e);padding:18px 16px;text-align:center;position:relative;}
[data-theme="light"] .ypt-header{background:linear-gradient(135deg,#1e3a5f,#0d2137);}
.ypt-label{font-size:.65rem;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.6);text-transform:uppercase;margin-bottom:12px;}
.ypt-clock{font-family:'Fira Code',monospace;font-size:4rem;font-weight:700;color:#fff;letter-spacing:6px;text-shadow:0 0 30px rgba(0,102,255,.5);animation:timerPulse 2s ease-in-out infinite;margin-bottom:8px;line-height:1;}
.ypt-clock.running{color:#4ade80;text-shadow:0 0 30px rgba(74,222,128,.5);}
.ypt-session-info{font-size:.72rem;color:rgba(255,255,255,.55);font-family:'Fira Code',monospace;}
.ypt-body{padding:14px;}
.ypt-task{width:100%;background:var(--bg3);border:1.5px solid var(--bd);border-radius:10px;padding:10px 13px;font-size:.87rem;color:var(--text);outline:none;margin-bottom:12px;}
.ypt-task:focus{border-color:var(--a);}
.ypt-task::placeholder{color:var(--text4);}
.ypt-modes{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:13px;}
.ypt-mode{padding:6px 14px;border-radius:22px;border:1.5px solid var(--bd);background:var(--bg3);font-size:.73rem;font-weight:600;color:var(--text3);cursor:pointer;transition:all .2s;}
.ypt-mode.on{border-color:var(--a);color:var(--a);background:var(--al);}
.ypt-btns{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
.ypt-start{padding:11px 28px;border-radius:12px;border:none;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .25s;font-family:inherit;}
.ypt-start.idle{background:var(--a);color:#fff;box-shadow:0 4px 14px rgba(0,102,255,.35);}
.ypt-start.idle:hover{background:var(--a2);transform:translateY(-2px);}
.ypt-start.running{background:var(--rd);color:#fff;box-shadow:0 4px 14px rgba(220,53,69,.3);}
.ypt-start.paused{background:var(--gr);color:#fff;box-shadow:0 4px 14px rgba(0,166,81,.3);}
.ypt-reset{padding:11px 18px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg3);color:var(--text3);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;}
.ypt-reset:hover{border-color:var(--rd);color:var(--rd);}
.ypt-stats-row{display:flex;gap:8px;}
.ypt-stat{flex:1;background:var(--bg3);border-radius:10px;padding:10px;text-align:center;}
.yst-val{font-family:'Fira Code',monospace;font-size:1rem;font-weight:700;color:var(--a);}
.yst-lbl{font-size:.6rem;color:var(--text3);margin-top:2px;}
/* Today's log */
.study-log{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:13px;margin-bottom:11px;}
.sl-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);}
.sl-item:last-child{border-bottom:none;}
.sl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sl-task{flex:1;font-size:.82rem;}
.sl-dur{font-family:'Fira Code',monospace;font-size:.78rem;color:var(--a);font-weight:600;}
/* Weekly chart */
.week-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin:12px 0;}
.wc-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.wc-fill{width:100%;border-radius:4px 4px 0 0;transition:height .6s;min-height:3px;}
.wc-day{font-size:.58rem;color:var(--text3);font-family:'Fira Code',monospace;}
.wc-val{font-size:.58rem;color:var(--a);font-family:'Fira Code',monospace;}

/* MYSTERY BOX */
.mystery-box{background:linear-gradient(135deg,var(--pu),#4f46e5);border-radius:var(--r);padding:18px;text-align:center;color:#fff;cursor:pointer;transition:all .3s;margin-bottom:11px;}
.mystery-box:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.3);}
.mb-e{font-size:2.8rem;display:block;margin-bottom:9px;animation:float 3s ease-in-out infinite;}

/* QUEST */
.quest-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:13px;margin-bottom:10px;}
.quest-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);}
.quest-item:last-child{border-bottom:none;}
.qi-ic{font-size:1.2rem;flex-shrink:0;}
.qi-info{flex:1;}
.qi-name{font-size:.83rem;font-weight:500;margin-bottom:4px;}
.qi-bar{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.qi-fill{height:100%;border-radius:3px;transition:width .5s;}
.qi-pct{font-size:.62rem;color:var(--text3);margin-top:3px;}
.qi-r{text-align:right;flex-shrink:0;font-size:.72rem;font-weight:600;color:var(--a);}
.qi-btn{background:var(--gr);color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:.7rem;font-weight:600;cursor:pointer;}

/* PROG */
.prog-item{margin-bottom:10px;}
.prog-label{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:5px;}
.prog-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .6s;}

/* SPIN */
#spinCanvas{display:block;margin:0 auto;}

/* LB */
.lb-tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:11px;}
.lb-tab{flex:1;padding:7px;border-radius:8px;border:none;background:transparent;font-size:.72rem;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;}
.lb-tab.on{background:var(--al);color:var(--a);font-weight:600;}
.lb-item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;transition:all .2s;}
.lb-item:hover{border-color:var(--a);}
.lb-item.me{border-color:var(--a);background:var(--al);}
.lb-rank{font-size:.8rem;font-weight:700;color:var(--text3);min-width:22px;text-align:center;font-family:'Fira Code',monospace;}
.lb-rank.g{color:#f5a623;}
.lb-rank.s{color:#adb5bd;}
.lb-rank.b{color:#cd7f32;}
.lb-info{flex:1;}
.lb-name{font-size:.87rem;font-weight:600;}
.lb-sub{font-size:.69rem;color:var(--text3);margin-top:2px;}
.lb-score{text-align:right;}
.lb-hrs{font-size:.9rem;font-weight:700;color:var(--a);font-family:'Fira Code',monospace;}
.lb-pts{font-size:.62rem;color:var(--text3);}
.live-badge{display:inline-flex;align-items:center;gap:4px;background:var(--rd);color:#fff;border-radius:5px;padding:2px 7px;font-size:.6rem;font-weight:700;}
.live-dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1s infinite;}

/* GROUPS */
.g-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px;}
.g-tabs::-webkit-scrollbar{display:none;}
.g-tab{flex-shrink:0;padding:7px 16px;border-radius:24px;border:1.5px solid var(--bd);background:var(--bg2);font-size:.79rem;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;}
.g-tab.on{background:var(--a);border-color:var(--a);color:#fff;}
.gc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer;transition:all .2s;}
.gc:hover{border-color:var(--a);box-shadow:var(--sh);}
.gc-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.gc-ic{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.gc-name{font-size:.9rem;font-weight:700;}
.gc-meta{font-size:.7rem;color:var(--text3);margin-top:2px;}
.gc-desc{font-size:.79rem;color:var(--text3);line-height:1.5;margin-bottom:8px;}
.gc-mavs{display:flex;margin-bottom:8px;}
.gc-mav{width:23px;height:23px;border-radius:50%;border:2px solid var(--bg2);margin-left:-5px;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#fff;}
.gc-mav:first-child{margin-left:0;}
.joined-tag{background:var(--al);color:var(--a);border-radius:20px;padding:3px 11px;font-size:.7rem;font-weight:600;}
.cgb{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1.5px dashed var(--bd2);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .2s;margin-bottom:12px;}
.cgb:hover{border-color:var(--a);background:var(--al);}
.cgb-ic{width:44px;height:44px;border-radius:12px;background:var(--al);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}

/* FULLSCREEN PANELS */
.fs{position:fixed;inset:0;z-index:400;background:var(--bg);display:none;flex-direction:column;}
.fs.show{display:flex;}
.fs-hd{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--bd);background:var(--bg);}
.fs-back{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;}
.fs-title{font-size:1rem;font-weight:700;flex:1;}
.fs-acts{display:flex;gap:6px;}

/* CHAT */
.chat-area{flex:1;overflow-y:auto;padding:11px 13px;display:flex;flex-direction:column;gap:9px;}
.chat-msg{display:flex;gap:8px;align-items:flex-start;}
.chat-msg.me{flex-direction:row-reverse;}
.cm-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#fff;}
.cm-content{max-width:73%;}
.cm-name{font-size:.62rem;font-weight:600;margin-bottom:3px;color:var(--text3);}
.chat-msg.me .cm-name{text-align:right;}
.cm-bubble{padding:9px 12px;border-radius:4px 16px 16px 16px;font-size:.83rem;line-height:1.55;}
.chat-msg.me .cm-bubble{border-radius:16px 4px 16px 16px;background:var(--a);color:#fff;}
.chat-msg:not(.me) .cm-bubble{background:var(--bg3);color:var(--text);}
.cm-time{font-size:.57rem;color:var(--text4);margin-top:3px;}
.chat-msg.me .cm-time{text-align:right;}
.date-sep{text-align:center;font-size:.67rem;color:var(--text3);font-weight:500;margin:5px 0;display:flex;align-items:center;gap:8px;}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--bd);}
.typing{display:flex;gap:3px;background:var(--bg3);padding:8px 12px;border-radius:16px;align-self:flex-start;}
.td{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:pulse .8s ease-in-out infinite;}
.td:nth-child(2){animation-delay:.15s;}
.td:nth-child(3){animation-delay:.3s;}
.chat-inp{border-top:1px solid var(--bd);padding:9px 13px;background:var(--bg);}
.cia-tools{display:flex;gap:5px;margin-bottom:7px;}
.cia-tool{width:33px;height:33px;border-radius:50%;background:var(--bg3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.8rem;cursor:pointer;transition:all .2s;}
.cia-tool:hover{border-color:var(--a);}
.cia-row{display:flex;align-items:flex-end;gap:8px;}
.cia-inp{flex:1;background:var(--bg3);border:1.5px solid var(--bd);border-radius:22px;padding:9px 14px;font-size:.84rem;color:var(--text);outline:none;resize:none;max-height:110px;min-height:38px;line-height:1.5;transition:border-color .2s;}
.cia-inp:focus{border-color:var(--a);}
.cia-inp::placeholder{color:var(--text4);}
.cia-send{width:38px;height:38px;border-radius:50%;background:var(--a);border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;cursor:pointer;transition:all .2s;}
.cia-send:hover{background:var(--a2);transform:scale(1.05);}

/* DM LIST */
.dm-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .2s;}
.dm-item:hover{border-color:var(--a);}
.dm-item.unread{background:var(--al);border-color:rgba(0,102,255,.2);}
.dmi-av{position:relative;}
.dmi-sts{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg2);}
.dmi-sts.on{background:var(--gr);}
.dmi-sts.off{background:var(--text4);}
.dmi-info{flex:1;min-width:0;}
.dmi-name{font-size:.87rem;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:5px;}
.dmi-prev{font-size:.75rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dmi-r{text-align:right;flex-shrink:0;}
.dmi-time{font-size:.64rem;color:var(--text4);}
.dmi-unread{width:18px;height:18px;border-radius:50%;background:var(--a);color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:3px 0 0 auto;}

/* HSC INFO */
.hsc-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px;}
.hsc-tabs::-webkit-scrollbar{display:none;}
.hsc-tab{flex-shrink:0;padding:6px 15px;border-radius:22px;border:1.5px solid var(--bd);background:var(--bg2);font-size:.76rem;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;}
.hsc-tab.on{background:var(--a);border-color:var(--a);color:#fff;}
.sub-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.sub-card-hd{display:flex;align-items:center;gap:11px;padding:13px;cursor:pointer;transition:background .2s;}
.sub-card-hd:hover{background:var(--bg3);}
.sub-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.sub-name{font-size:.9rem;font-weight:700;}
.sub-meta{font-size:.7rem;color:var(--text3);margin-top:2px;}
.sub-body{padding:0 13px 13px;display:none;}
.sub-body.open{display:block;}
.ch-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--bd);}
.ch-item:last-child{border-bottom:none;}
.ch-num{width:26px;height:26px;border-radius:50%;background:var(--al);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;flex-shrink:0;}
.ch-info{flex:1;}
.ch-name{font-size:.83rem;font-weight:600;}
.ch-marks{font-size:.7rem;color:var(--text3);margin-top:2px;}
.ch-imp{font-size:.65rem;color:var(--rd);font-weight:600;}
.tip-box{background:linear-gradient(135deg,rgba(0,102,255,.06),rgba(124,58,237,.04));border:1px solid rgba(0,102,255,.15);border-radius:10px;padding:11px 13px;margin-top:10px;}
.tip-title{font-size:.78rem;font-weight:700;color:var(--a);margin-bottom:5px;}
.tip-text{font-size:.78rem;line-height:1.65;color:var(--text2);}
.syllabus-btn{background:var(--a);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;}

/* PROFILE */
.p-cover{height:120px;background:linear-gradient(135deg,var(--a),var(--pu));display:flex;align-items:center;justify-content:center;font-size:3rem;}
.p-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px;}
.ps-item{background:var(--bg3);border-radius:var(--r2);padding:10px 5px;text-align:center;}
.ps-n{font-size:.9rem;font-weight:700;color:var(--a);}
.ps-l{font-size:.57rem;color:var(--text3);margin-top:2px;}
.set-item{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .2s;}
.set-item:hover{background:var(--bg3);}
.set-item:last-child{border-bottom:none;}
.si-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;}
.si-tx h4{font-size:.85rem;font-weight:500;}
.si-tx p{font-size:.69rem;color:var(--text3);margin-top:1px;}
.si-arr{margin-left:auto;color:var(--text3);}

/* ID CARD */
.id-card{background:linear-gradient(135deg,var(--a),var(--pu));border-radius:16px;padding:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px;}
.id-card::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.1);}
.id-card::after{content:'';position:absolute;bottom:-30px;left:-15px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);}
.id-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative;z-index:1;}
.id-av-wrap{position:relative;}
.id-av{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;border:3px solid rgba(255,255,255,.4);}
.id-name{font-size:1.1rem;font-weight:800;}
.id-class{font-size:.75rem;opacity:.85;margin-top:2px;}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1;}
.id-field{background:rgba(255,255,255,.12);border-radius:9px;padding:9px 12px;}
.id-field-label{font-size:.6rem;opacity:.7;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;}
.id-field-val{font-size:.85rem;font-weight:700;}
.id-field-val.mono{font-family:'Fira Code',monospace;}
.id-btns{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1;}
.id-btn{flex:1;padding:9px;border-radius:10px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;}
.id-btn:hover{background:rgba(255,255,255,.25);}
/* Edit name modal */
#editNameModal{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;}
#editNameModal.show{display:flex;}
.en-box{background:var(--bg);border-radius:16px;padding:24px;width:100%;max-width:360px;animation:pop .35s ease;box-shadow:var(--shl);}
.en-title{font-size:.95rem;font-weight:700;margin-bottom:14px;}
.en-field{margin-bottom:11px;}
.en-field label{display:block;font-size:.79rem;font-weight:500;color:var(--text2);margin-bottom:5px;}

/* BADGES */
.badges-grid{display:flex;gap:8px;flex-wrap:wrap;}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:3px;}
.badge-ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border:2px solid var(--bd);}
.badge-ic.earned{border-color:var(--gd);box-shadow:0 0 10px rgba(245,166,35,.2);}
.badge-ic.locked{opacity:.35;filter:grayscale(1);}
.badge-nm{font-size:.56rem;color:var(--text3);text-align:center;}

/* VIDEO */
.v-cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;margin-bottom:11px;}
.v-cats::-webkit-scrollbar{display:none;}
.vcat{flex-shrink:0;padding:5px 14px;border-radius:24px;border:1.5px solid var(--bd);background:var(--bg2);font-size:.75rem;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;}
.vcat.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.vc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.vc{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .2s;}
.vc:hover{border-color:var(--a);transform:translateY(-2px);box-shadow:var(--sh);}
.vc-thumb{width:100%;aspect-ratio:16/9;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:2rem;position:relative;}
.vc-dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.75);color:#fff;font-size:.6rem;padding:2px 6px;border-radius:4px;font-family:'Fira Code',monospace;}
.vc-info{padding:8px;}
.vc-title{font-size:.77rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px;}
.vc-meta{font-size:.64rem;color:var(--text3);}

/* FOMO */
.fomo{border-radius:var(--r);padding:10px 13px;margin-bottom:9px;display:flex;align-items:center;gap:9px;font-size:.81rem;}
.fomo.urgent{background:#fff5f5;border:1px solid #ffd0d0;color:var(--rd);}
.fomo.info{background:var(--al);border:1px solid rgba(0,102,255,.2);color:var(--a);}
[data-theme="dark"] .fomo.urgent{background:rgba(220,53,69,.1);border-color:rgba(220,53,69,.3);}
[data-theme="dark"] .fomo.info{background:rgba(0,102,255,.1);border-color:rgba(0,102,255,.25);}
.fomo-timer{font-family:'Fira Code',monospace;font-size:.87rem;font-weight:700;color:var(--rd);}

/* SHOP */
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.shop-item{background:var(--bg2);border:1.5px solid var(--bd);border-radius:var(--r);padding:12px;text-align:center;cursor:pointer;position:relative;transition:all .22s;}
.shop-item:hover{border-color:var(--a);transform:translateY(-2px);box-shadow:var(--sh);}
.shop-item.feat{border-color:var(--gd);}
.shop-hot{position:absolute;top:-7px;right:8px;background:var(--rd);color:#fff;font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:20px;}
.shop-ic{font-size:1.7rem;margin-bottom:6px;display:block;}
.shop-nm{font-size:.79rem;font-weight:600;margin-bottom:3px;}
.shop-desc{font-size:.65rem;color:var(--text3);margin-bottom:6px;line-height:1.4;}
.shop-price{font-size:.82rem;font-weight:700;color:var(--gd);font-family:'Fira Code',monospace;}

/* NOTIF */
#notifC{position:fixed;top:64px;right:11px;z-index:9990;display:flex;flex-direction:column;gap:7px;pointer-events:none;max-width:270px;}
.notif-t{background:var(--bg);border:1px solid var(--bd);border-radius:13px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shl);animation:notifIn .35s ease;pointer-events:auto;}
.nt-ic{font-size:1.1rem;flex-shrink:0;}
.nt-title{font-size:.77rem;font-weight:700;margin-bottom:1px;}
.nt-text{font-size:.71rem;color:var(--text3);}
.xp-pop{position:fixed;pointer-events:none;z-index:9995;font-size:1rem;font-weight:700;font-family:'Fira Code',monospace;color:var(--gr);animation:xpFly 1.2s ease forwards;}
#confettiC{position:fixed;inset:0;pointer-events:none;z-index:9994;overflow:hidden;}

/* LEVEL UP */
#luModal{position:fixed;inset:0;z-index:9991;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;}
#luModal.show{display:flex;}
.lu-card{background:var(--bg);border-radius:20px;padding:28px 22px;text-align:center;max-width:300px;width:90%;animation:pop .5s ease;box-shadow:var(--shl);border:1px solid var(--bd);}

/* MISC */
.online-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gr);animation:blink 2s infinite;vertical-align:middle;}
